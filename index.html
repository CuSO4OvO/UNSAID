<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNSAID — An East Asian Family Simulator</title>
<style>
:root{
  --bg:#14100d; --bg2:#1e1712;
  --ink:#f0e6d8; --dim:#9c8b78; --faint:#5d5145;
  --amber:#d9a441; --amber2:#f0c674;
  --cold:#6fa8dc; --cold2:#9ecbf0;
  --red:#c9553d; --green:#7fa860;
  --line:rgba(217,164,65,.16);
  --serif:Georgia,"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --sans:"Inter","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.app{position:relative;height:100vh;width:100vw;overflow:hidden}

/* ---- table backdrop ---- */
.table{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.table::before{
  content:"";position:absolute;left:50%;top:58%;width:150vmax;height:150vmax;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#4a3625 0%,#33251a 32%,#1d1510 62%,#14100d 100%);
}
.table::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 22% 20%,rgba(255,190,110,.10),transparent 34%),
    radial-gradient(circle at 78% 78%,rgba(255,150,80,.05),transparent 40%),
    radial-gradient(circle at 50% 50%,transparent 42%,rgba(0,0,0,.72) 100%);
}
.plate{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:150vmax;height:150vmax;opacity:.5}
.plate circle,.plate ellipse{fill:none;stroke:rgba(255,215,160,.07);stroke-width:1.2}

/* ---- layout ---- */
.wrap{position:relative;height:100%;display:flex;flex-direction:column}
.topbar{
  position:relative;z-index:30;   /* must sit ABOVE #overlay, or its buttons are unclickable */
  display:flex;align-items:center;gap:18px;padding:10px 20px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);flex:0 0 auto;flex-wrap:wrap;
}
.logo{font-family:var(--serif);font-size:15px;letter-spacing:.32em;color:var(--amber);text-transform:none}
.logo b{font-weight:400}
.topbar .sp{flex:1}
.key{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--line);border-radius:3px;padding:5px 9px;transition:.15s;
}
.key:hover{border-color:var(--amber);color:var(--amber2)}
.key i{font-style:normal;color:var(--amber);font-weight:600}
.key.on{background:rgba(217,164,65,.12);border-color:var(--amber);color:var(--amber2)}
.body{flex:1;display:flex;min-height:0}

/* ---- sidebar ---- */
.side{
  width:250px;flex:0 0 250px;border-right:1px solid var(--line);
  padding:16px 14px;overflow-y:auto;font-size:12px;
}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:var(--faint);border-radius:9px}
.sec{margin-bottom:20px}
.sec h4{
  font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:9px;
}
.meter{margin-bottom:11px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.meter .nm{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.meter .st{font-size:10px;color:var(--dim);letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.meter .st .num{color:var(--ink);font-weight:600}
.meter .st .mx{color:var(--dim)}
.meter .st em{font-style:normal;color:var(--faint)}
.meter.danger .st .num{color:var(--red)}
.meter.danger .st em{color:var(--red)}
.pips{display:flex;gap:3px}
.pips i{height:5px;flex:1;background:rgba(255,255,255,.07);border-radius:1px;transition:.3s}
.meter[data-k=face]   .pips i.on{background:var(--amber)}
.meter[data-k=filial] .pips i.on{background:#c9a86a}
.meter[data-k=self]   .pips i.on{background:var(--green)}
.meter[data-k=stress] .pips i.on{background:var(--red)}
.meter[data-k=unsaid] .pips i.on{background:var(--cold)}
.meter.danger .nm{color:var(--red)}
.meter.danger .pips i.on{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
.meter.flash .pips{filter:brightness(2.4)}
.led{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;color:var(--dim)}
.led b{font-weight:500;color:var(--ink)}
.led .g{color:var(--amber2)}
.led .o{color:var(--red)}
.led .gap{color:var(--faint);font-size:10px}
.web{display:flex;flex-direction:column;gap:5px}
.wn{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
.wn .nm2{flex:0 0 72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.wn .dot.k{background:var(--cold);box-shadow:0 0 7px var(--cold)}
.wn .dot.hi{background:var(--amber)}
.wn .bar{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.wn .bar i{display:block;height:100%;background:var(--amber);transition:.4s}
.wn .cl{font-size:9px;color:var(--faint);letter-spacing:.08em}
.keeps{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim)}
.keeps div{opacity:.85}

/* ---- main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;padding:18px 34px 16px;overflow-y:auto}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--faint);border-radius:9px}
.scene{max-width:820px;margin:0 auto;width:100%}
/* The speaker used to be 10px amber text — too quiet to answer "who is talking?"
   at a glance. It is now a chip, which also gives narration its own muted look. */
.spk{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.spk .who{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  color:var(--amber2);background:rgba(217,164,65,.14);
  border:1px solid rgba(217,164,65,.34);border-radius:3px;
  padding:3px 11px;white-space:nowrap;
}
.spk .who.narr{color:var(--dim);background:rgba(255,255,255,.05);border-color:var(--line)}
.spk::after{content:"";flex:1;height:1px;background:var(--line)}
.line{
  font-family:var(--serif);font-size:clamp(19px,2.3vw,28px);line-height:1.5;
  margin-bottom:9px;letter-spacing:.01em;
}
.line.zh{font-family:var(--serif);letter-spacing:.06em}
.sub{
  font-size:13px;color:var(--dim);font-style:italic;letter-spacing:.02em;
  margin-bottom:6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.sub .en{font-style:normal;color:var(--cold2)}
.sub .conf{
  font-size:10px;letter-spacing:.1em;border:1px solid var(--line);
  border-radius:2px;padding:2px 6px;color:var(--faint);font-style:normal;
}
.sub .conf.low{border-color:var(--red);color:var(--red)}
.narr{font-size:15px;color:var(--dim);line-height:1.8;margin-bottom:14px;max-width:640px}
.divider{height:1px;background:var(--line);margin:15px 0 13px}
.qh{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:4px;padding:10px 13px;
  background:rgba(255,255,255,.012);transition:.13s;position:relative;
}
.opt:hover{border-color:var(--amber);background:rgba(217,164,65,.07);transform:translateX(3px)}
.opt .k{
  font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--amber);
  border:1px solid var(--line);border-radius:3px;padding:2px 6px;flex:0 0 auto;margin-top:2px;
}
.opt .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.opt .v{
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  display:block;
}
.opt .l{font-size:15px;line-height:1.5;font-family:var(--serif);display:block}
.opt .fx{
  display:block;font-size:10.5px;letter-spacing:.09em;color:var(--faint);
  white-space:normal;line-height:1.5;
}
.opt .fx .dice{color:var(--cold2);font-weight:600}
.opt .fx .failmark{color:var(--red);opacity:.75}
.opt .fx b{font-weight:600}
.opt.special{border-color:rgba(111,168,220,.4);background:rgba(111,168,220,.07)}
.opt.special .k{color:var(--cold2);border-color:rgba(111,168,220,.4)}
.opt.special:hover{background:rgba(111,168,220,.14);border-color:var(--cold)}
.opt:disabled{opacity:.35;cursor:not-allowed;transform:none}
.inner{
  margin-top:12px;border-left:2px solid rgba(111,168,220,.35);padding:8px 0 8px 14px;
}
.inner .t{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.inner .x{font-family:var(--serif);font-size:16px;color:var(--cold2);line-height:1.55}
.inner .sp{font-size:10px;color:var(--faint);margin-top:7px;letter-spacing:.06em}
.inner .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.plus{
  font-size:9.5px;letter-spacing:.14em;color:var(--cold);
  border:1px solid rgba(111,168,220,.4);border-radius:2px;padding:2px 6px;
  white-space:nowrap;flex:0 0 auto;
}
.notices{margin:0 0 15px;border-left:2px solid rgba(217,164,65,.5);padding:7px 0 7px 13px}
.notices div{font-size:12.5px;color:var(--amber2);line-height:1.7}
.notices div.bad{color:var(--red)}
.votewrap{margin-top:16px;border-top:1px solid var(--line);padding-top:11px}
.votewrap .vh{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.vrow{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--dim);margin-bottom:5px}
.vrow .vl{width:16px;font-weight:700;color:var(--amber)}
.vrow .vb{flex:1;height:14px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.vrow .vb i{display:block;height:100%;background:var(--amber);width:0;transition:.25s}
.vrow .vc{width:34px;text-align:right;color:var(--amber2);font-variant-numeric:tabular-nums}
.vrow.win .vl{color:var(--cold2)}
.vrow.win .vb i{background:var(--cold)}
.flash{animation:fl .7s}
@keyframes fl{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}

/* ---- overlay ---- */
/* keyed on BOTH the class and the id: the JS finds this by id, so an id rule
   means a missing class attribute can never again take the whole game off-screen */
/* align-items:flex-start + margin:auto on the child is the fix for the classic
   "flex centring clips the top when the content is taller than the viewport"
   bug — the Archive page was losing its heading that way. */
.ov,#overlay{
  position:absolute;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;
  background:rgba(8,6,4,.985);padding:30px;overflow-y:auto;
}
.card{max-width:660px;width:100%;text-align:center;padding:20px 0;margin:auto}
.card h1{
  font-family:var(--serif);font-size:clamp(38px,7vw,68px);letter-spacing:.34em;
  font-weight:400;color:var(--amber2);margin-bottom:10px;text-indent:.34em;
}
.card h2{font-family:var(--serif);font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);font-weight:400;margin-bottom:28px}
.tag{font-family:var(--serif);font-size:15px;color:var(--dim);line-height:1.85;margin-bottom:34px;font-style:italic}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:30px}
.mi{
  border:1px solid var(--line);border-radius:4px;padding:11px 30px;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);transition:.15s;min-width:270px;
}
.mi:hover{border-color:var(--amber);color:var(--amber2);background:rgba(217,164,65,.08)}
.mi.primary{border-color:var(--amber);color:var(--amber2)}
.auth{font-size:11px;letter-spacing:.2em;color:var(--faint);margin-top:8px}
.auth b{color:var(--amber);font-weight:500}
.hint{font-size:10px;letter-spacing:.1em;color:var(--faint);line-height:2;margin-top:18px}
.hint kbd{border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:var(--dim);font-family:inherit;font-size:10px}
.end-t{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.end-n{font-family:var(--serif);font-size:clamp(26px,4.6vw,44px);color:var(--amber2);letter-spacing:.1em;margin-bottom:6px}
.end-z{font-family:var(--serif);font-size:15px;color:var(--dim);letter-spacing:.3em;margin-bottom:26px}
.end-txt{font-family:var(--serif);font-size:clamp(16px,2.1vw,21px);line-height:1.85;color:var(--ink);margin-bottom:14px}
.end-sub{font-size:13px;color:var(--cold2);font-style:italic;margin-bottom:6px}
.stats{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:26px 0;font-size:11px;color:var(--faint);letter-spacing:.1em}
.stats b{color:var(--dim);font-weight:500}
.unlocked{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;font-size:12px;color:var(--dim)}
.unlocked b{color:var(--amber2);font-weight:500}
.arch{max-width:820px;width:100%;text-align:left}
.arch h3{font-family:var(--serif);font-size:22px;color:var(--amber2);letter-spacing:.2em;margin-bottom:20px;font-weight:400}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;margin-bottom:24px}
.ac{border:1px solid var(--line);border-radius:4px;padding:11px 13px;font-size:12px}
.ac.locked{opacity:.3}
.ac .n{color:var(--amber2);margin-bottom:4px;font-family:var(--serif);font-size:14px}
.ac .d{color:var(--faint);font-size:10.5px;line-height:1.6}
.big .line{font-size:clamp(26px,3.4vw,40px)}
.big .opt .l{font-size:19px}
.big .opt .v{font-size:11px}
.big .opt{padding:14px 16px}
.big .spk .who{font-size:14px;letter-spacing:.2em;padding:4px 14px}
.foot{
  flex:0 0 auto;padding:8px 20px;border-top:1px solid var(--line);
  font-size:9.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.foot b{color:var(--amber);font-weight:500;text-transform:none;letter-spacing:.1em}

/* ---- tutorial ---- */
.tut-card{text-align:center}
.tut-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.tut-count{font-size:10px;letter-spacing:.22em;color:var(--faint);font-variant-numeric:tabular-nums}
.tut-step{min-height:300px;display:flex;flex-direction:column;align-items:center}
.tut-step.fwd{animation:tutInFwd .38s cubic-bezier(.22,1,.36,1)}
.tut-step.back{animation:tutInBack .38s cubic-bezier(.22,1,.36,1)}
@keyframes tutInFwd{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:none}}
@keyframes tutInBack{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:none}}
.tut-t{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);color:var(--amber2);letter-spacing:.1em;margin-bottom:16px}
.tut-b{font-size:14.5px;color:var(--dim);line-height:1.95;max-width:540px;margin-bottom:8px}
.tut-demo{width:100%;max-width:520px;margin:18px auto 4px}
.tut-dots{display:flex;gap:7px;justify-content:center;margin:26px 0 22px}
.tut-dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);transition:.3s}
.tut-dots i.on{width:22px;background:var(--amber)}
.tut-nav{display:flex;gap:10px;justify-content:center;align-items:center}
.mi[disabled]{opacity:.35;cursor:not-allowed}
.mi[disabled]:hover{border-color:var(--line);color:var(--dim);background:none}
/* demo: the five meters — bars grow in, danger words fade in behind them */
.tm{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.tm .l{width:58px;text-align:right;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tm .bar{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.tm .bar i{display:block;height:100%;width:0;border-radius:2px;animation:tutbar 1.4s cubic-bezier(.22,1,.36,1) both}
@keyframes tutbar{to{width:var(--w)}}
.tm .w{width:70px;text-align:left;font-size:9px;letter-spacing:.1em;color:var(--red);opacity:0;animation:tutfade .5s both}
@keyframes tutfade{to{opacity:1}}
/* demo: a sample option card, inert */
.tut-opt{cursor:default;text-align:left}
.tut-opt:hover{transform:none}
/* demo: the three readings of one line, cycling purely in CSS */
.tut-layers{position:relative;height:104px}
.tl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;animation:tlcycle 9s infinite}
.tl:nth-child(2){animation-delay:3s}
.tl:nth-child(3){animation-delay:6s}
@keyframes tlcycle{0%{opacity:0;transform:translateY(10px)}5%,30%{opacity:1;transform:none}35%,100%{opacity:0;transform:translateY(-6px)}}
.tl .q{font-family:var(--serif);font-size:17px;color:var(--ink)}
.tl .tg{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:2px;padding:2px 7px}
/* demo: ten unsaid pips fill once, then the label flips to the flood */
.tut-pips{display:flex;gap:5px;justify-content:center;margin:22px 0 12px}
.tut-pips i{width:26px;height:6px;border-radius:1px;background:rgba(255,255,255,.07);animation:tp .35s both}
@keyframes tp{to{background:var(--cold);box-shadow:0 0 8px rgba(111,168,220,.55)}}
.tut-pip-lbl{position:relative;height:20px;text-align:center;font-size:11px;letter-spacing:.18em}
.tp1,.tp2{position:absolute;inset:0}
.tp1{color:var(--cold2);animation:tpout .5s 4.3s both}
.tp2{color:var(--red);opacity:0;animation:tutfade .5s 4.3s both}
@keyframes tpout{to{opacity:0}}
/* demo: ledger + web, reusing the sidebar's own classes */
.tut-web{max-width:340px;margin:0 auto;text-align:left}
.tut-web .dot.k{animation:dotpulse 1.6s infinite}
@keyframes dotpulse{50%{box-shadow:0 0 12px var(--cold)}}
.tut-note{font-size:10px;letter-spacing:.14em;color:var(--faint);text-align:center;margin-top:10px}

@media(max-width:900px){
  .side{display:none}
  .main{padding:18px 16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="table">
    <svg class="plate" viewBox="0 0 1000 1000" aria-hidden="true">
      <circle cx="500" cy="500" r="150"/><circle cx="500" cy="500" r="230"/>
      <circle cx="500" cy="500" r="330"/><circle cx="500" cy="500" r="430"/>
      <circle cx="330" cy="330" r="46"/><circle cx="670" cy="330" r="46"/>
      <circle cx="330" cy="670" r="46"/><circle cx="670" cy="670" r="46"/>
      <circle cx="500" cy="215" r="43"/><circle cx="500" cy="785" r="43"/>
      <circle cx="215" cy="500" r="43"/><circle cx="785" cy="500" r="43"/>
      <ellipse cx="500" cy="500" rx="90" ry="90"/>
    </svg>
  </div>
  <div class="wrap">
    <div class="topbar">
      <span class="logo"><b>U N S A I D</b></span>
      <span id="course"></span>
      <span class="sp"></span>
      <button class="key" id="k-lang"><i>L</i><span id="lang-lbl">中文</span></button>
      <button class="key" id="k-mode"><i>Tab</i><span id="mode-lbl">Literal</span></button>
      <button class="key" id="k-hint"><i>H</i><span id="hint-lbl">Hints</span></button>
      <button class="key" id="k-help"><i>?</i><span id="help-lbl">Help</span></button>
      <span id="clock" style="letter-spacing:.1em"></span>
    </div>
    <div class="body">
      <aside class="side">
        <div class="sec"><h4 id="s-meters">State</h4><div id="meters"></div></div>
        <div class="sec"><h4 id="s-ledger">The Ledger</h4><div id="ledger"></div></div>
        <div class="sec"><h4 id="s-web">The Table</h4><div class="web" id="web"></div></div>
        <div class="sec"><h4 id="s-keeps">Keepsakes</h4><div class="keeps" id="keeps"></div></div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="foot">
      <span id="f-l">UNSAID — An East Asian Family Simulator</span>
      <span id="f-r">by <b>26药3 lyx</b></span>
    </div>
  </div>
  <div class="ov" id="overlay"></div>
</div>

<script>
"use strict";
/* =========================================================================

   the literal string "null", an id from an older build. Validate TYPES and
   VALUES, or a stale save turns the first click of "Begin" into a blank page. */
function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY);
    if(raw){
      const m = JSON.parse(raw);
      if(m && typeof m === "object") return {
        runs: Math.max(0, m.runs|0),
        keepsakes: Array.isArray(m.keepsakes) ? m.keepsakes.filter(k => typeof k==="string" && KEEPSAKES[k]) : [],
        endings:   Array.isArray(m.endings)   ? m.endings.filter(e => ENDINGS.some(x => x.id === e)) : [],
        secrets:   Array.isArray(m.secrets)   ? m.secrets.filter(k => typeof k==="string" && ESCAPES[k]) : []
      };
    }
  }catch(e){}
  return FRESH_META();
}

/* ---- effects ---- */
function applyVerb(verb, npcId, special){
  const V = VERBS[verb]; if(!V) return;
  const m = multFor(verb, npcId);
  let roll = null, success = true;
  if(verb==="joke"){
    // 2d6, succeed on 7+. That makes it a real gamble rather than a trap:
    // roughly EV-neutral on face/filial, positive on stress, high variance.
    const d1=rnd(6)+1, d2=rnd(6)+1; roll=d1+d2;
    success = (roll>=7);
  }
  const delta = {};
  for(const k in V.fx){
    let v = V.fx[k];
    if(v!==0) v = Math.round(v*m);
    if(verb==="joke" && !success && (k==="face"||k==="filial")) v = -Math.abs(v)-2;
    if(verb==="joke" && !success && k==="stress") v = 4;
    delta[k]=v;
  }
  if(verb!=="unsaid") delta.unsaid = (delta.unsaid||0) + BASE_UNSAID;
  return {delta, roll, success, mult:m};
}
function applyDelta(delta){
  for(const k in delta){
    S[k] = clamp(S[k]+delta[k], 0, k==="unsaid"?99:100);
  }
}
function applyLedger(verb, npcId){
  if(!npcId||!S.ledger[npcId]) return;
  const g = LED[verb]||0;
  S.ledger[npcId].gave = Math.max(0, S.ledger[npcId].gave + g*2);
  S.ledger[npcId].owed = Math.max(0, S.ledger[npcId].owed + Math.round(g*0.8));
  S.ledger[npcId].owed = Math.min(S.ledger[npcId].owed, S.ledger[npcId].gave);
}
function applyRipples(npcId){
  const log=[];
  for(const r of RIPPLES){
    if(r.if.npc!==npcId) continue;
    const f = S.npc[npcId].favor;
    if(r.if.min!==undefined && f < FAVOR_START+r.if.min) continue;
    if(r.if.max!==undefined && f > FAVOR_START+r.if.max) continue;
    for(const [tid,d] of r.then){
      if(tid==="*"){ for(const id in NPCS) S.npc[id].favor = clamp(S.npc[id].favor+d,0,100); }
      else S.npc[tid].favor = clamp(S.npc[tid].favor+d,0,100);
    }
    log.push(say(r));
  }
  return log;
}
function checkHardening(verb){
  const G = {agree:["agree","soften","victim"], confront:["confront","passive"], silence:["silence","dumb"]};
  for(const g in G){
    if(G[g].indexOf(verb)>=0) S.hits[g]++;
    else S.hits[g] = 0;
  }
  if(S.hits.agree>=3 && !S.hardened.agree){ S.hardened.agree=true; return "agree"; }
  if(S.hits.confront>=3 && !S.hardened.confront){ S.hardened.confront=true; return "confront"; }
  if(S.hits.silence>=3 && !S.hardened.silence){ S.hardened.silence=true; return "silence"; }
  return null;
}
function hardenedOut(verb){
  if(S.hardened.agree && ["confront","unsaid"].indexOf(verb)>=0) return true;
  if(S.hardened.confront && ["soften","ritual","agree"].indexOf(verb)>=0) return true;
  if(S.hardened.silence && verb==="silence") return true;
  return false;
}

/* ---- endings ----
   Evaluated most-specific-first. The ledger endings sit near the bottom on
   purpose: the Reckoning happens every year, so it cannot be allowed to
   swallow the endings that describe who you actually were. */
const ENDING_ORDER = ["flatline","she","flip","severance","became",
                      "invisible","perfect","sensible","outsider","nextyear",
                      "ledgerTaken","ledgerRefused","ordinary"];
/* The Wheel gate: N full years survived and N keepsakes kept. Callers pass
   META.runs or META.runs+1 depending on whether the current year is counted. */
function wheelGateOpen(runs){ return runs>=3 && META.keepsakes.length>=3; }
function resolveEnding(){
  const wheelOpen = wheelGateOpen(META.runs+1) || PRES_UNLOCK;
  const st = {
    face:S.face, filial:S.filial, self:S.self, stress:S.stress, unsaid:S.unsaid,
    flooded:S.flooded, silenceAfterFlood:S.silenceAfterFlood, reckoning:S.reckoning,
    momSecret:S.momSecret, lectured:S.lectured, secrets:S.found.length,
    wheelOpen
  };
  for(const id of ENDING_ORDER){
    const e = ENDINGS.find(x=>x.id===id);
    if(e && e.cond(st)) return e;
  }
  return ENDINGS.find(x=>x.id==="ordinary");
}
/* The Wheel is not a prize for finishing. It is what happens to someone who
   stayed in the family, stayed themselves, and said the unspeakable once. */
function wheelEarned(){
  const open = wheelGateOpen(META.runs+1) || PRES_UNLOCK;
  return open && S.self>=60 && S.filial>=55 && S.flooded && S.stress<100 && S.face>0;
}

function renderSide(){

function fxArrows(fx){
  const names={face:"face",filial:"filial",self:"self",stress:"stress"};
  const parts=[];
  for(const k in fx){
    if(k==="unsaid") continue;
    const v=fx[k]; if(!v) continue;
    const n=Math.abs(v)>=10?2:1;
    const col=v>0?"var(--green)":"var(--red)";
    parts.push(`<b style="color:${col}">${t(names[k])}${v>0?"↑":"↓"}${n>1?"↑":""}</b>`);
  }
  return parts.join(" ");
}
/* A verb that can fail must never advertise only its success case — that was a
   lie ~42% of the time on MAKE A JOKE. Gambles show both outcomes. */
function fxText(verb, node, npcId){
  if(!HINTS) return "";
  const V=VERBS[verb]; if(!V) return "";
  const gamble = (verb==="joke") || (node && node.check && RISKY_VERBS.indexOf(verb)>=0);
  if(!gamble) return fxArrows(V.fx);
  const m = multFor(verb, npcId);
  const ok = {}, bad = {};
  for(const k in V.fx){
    const good = V.fx[k]!==0 ? Math.round(V.fx[k]*m) : 0;
    ok[k] = good;
    bad[k] = (k==="face"||k==="filial") ? -Math.abs(good)-2
           : (k==="stress") ? 4 : good;
  }
  const odds = verb==="joke" ? "7+" : (node.check.diff+"+");
  return `<b class="dice">\u2684${odds}</b> ${fxArrows(ok)}` +
         ` <span class="failmark">\u2717</span> ${fxArrows(bad)}`;
}
function fxTextSimple(verb){ return HINTS ? fxArrows((VERBS[verb]||{}).fx||{}) : ""; }

          `<span style="color:var(--faint);text-transform:none;letter-spacing:.06em">· ${hint}</span></div>`;
  opts.forEach((op,i)=>{
    h += `<div class="vrow" data-vote="${i}"><span class="vl">${KEYS[i]}</span>` +
         `<span class="vb"><i></i></span><span class="vc">0</span></div>`;
  });
  return h + `</div>`;
}
function renderVotes(){
  const rows = MAIN.querySelectorAll(".vrow");
  if(!rows || !rows.length) return;
  const vals = Object.keys(VOTES).map(k=>VOTES[k]);
  const max = vals.length ? Math.max.apply(null, vals.concat([1])) : 1;
  Array.prototype.forEach.call(rows, r=>{
    const i = (r.dataset && r.dataset.vote !== undefined) ? +r.dataset.vote : -1;
    const n = VOTES[i] || 0;
    const c = r.querySelector && r.querySelector(".vc");
    const bar = r.querySelector && r.querySelector(".vb i");
    if(c) c.textContent = n;
    if(bar) bar.style.width = (n/max*100) + "%";
    if(r.classList) r.classList.toggle("win", n>0 && n===max);
  });
}
function voteWinner(live){
  let best = 0, bi = 0;
  live.forEach((b,i)=>{ const n = VOTES[i]||0; if(n>best){ best=n; bi=i; } });
  return live[bi];
}
function hasKeepsake(k){ return (META.keepsakes||[]).indexOf(k)>=0; }
/* Notices raised by the previous choice: ripples, misreads, failed checks, the
   leak. They persist until the next choice, so re-rendering the screen (L / Tab)
   does not wipe them. */
function noticesHTML(){
  const n = (S && S.noticeQueue) || [];
  if(!n.length) return "";
  return `<div class="notices">` +
    n.map(x=>`<div class="${x.bad?'bad':''}">▸ ${x.text}</div>`).join("") + `</div>`;
}

/* If anything throws after boot, show a page with a way out instead of a blank
   screen. A stale save must never be a dead end. */
function showBootError(err){
  try{
    OV.style.display = "flex";
    RESHOW = "error";
    OV.innerHTML = `<div class="card" style="text-align:left">
      <h2 style="color:var(--amber2);font-family:var(--serif);letter-spacing:.1em">
        ${LANG==="zh"?"UNSAID 启动失败":"UNSAID failed to start"}</h2>
      <p style="font:13px/1.8 ui-monospace,monospace;color:var(--ink);margin:0 0 12px;word-break:break-word">
        ${String((err && err.message) || err)}</p>
      <p style="color:var(--faint);margin:0 0 18px;font-size:13px">
        ${LANG==="zh"?"存档可能来自旧版本。你的进度没有被删除。":"Your saved progress may be from an older version. Nothing was deleted."}</p>
      <button class="mi" id="wipe">${LANG==="zh"?"清除进度并重新开始":"Reset progress and start"}</button>
    </div>`;
    const b = $("wipe");
    if(b) b.onclick = ()=>{ META = FRESH_META(); saveMeta(META); startRun(false); };
  }catch(e){ /* last resort: at least log it */ }
  console.error(err);
}

/* ---- renderNode helpers ---- */
/* Secrets surface on arrival, BEFORE rendering, so the reveal text can be part
   of the screen. (This used to run after MAIN.innerHTML was built, and read
   ctx.reveal which only a dead function ever produced — the text never showed.)
   Returns the ids revealed this visit; "__permit" marks the keepsake grant. */
function applyReveals(node){
  const revealedNow = [];
  const revs = node.reveal ? [].concat(node.reveal) : [];
  revs.forEach(rev=>{
    if(!ESCAPES[rev] || S.found.indexOf(rev)>=0) return;
    S.found.push(rev);
    revealedNow.push(rev);
    if(MOM_OPENS_UP.indexOf(rev)>=0) S.momSecret = true;
    META.secrets = Array.from(new Set(META.secrets.concat([rev])));
    S.self = clamp(S.self+4,0,100); S.stress = clamp(S.stress-5,0,100);
  });
  if(node.id==="os_art") S.momSecret = true;
  // "Mom's exam permit" is tied to learning who your mother was, not to an
  // ending — that is what the design doc always said. Granted here, mid-run.
  if(S.momSecret && META.keepsakes.indexOf("permit")<0){
    META.keepsakes.push("permit"); saveMeta(META);
    S.keepsakes = META.keepsakes.slice();
    revealedNow.push("__permit");
  }
  return revealedNow;
}
/* The four ways an option can be locked: the unsaid is not ready, your habits
   hardened against it, you lack the keepsake, or you lack the secret. */
function optLocked(op, isUnsaid, unsaidOK){
  // A keepsake option is exempt from Hardening: owning the tin gives you a way
  // back to your father that your own habits cannot take away.
  return (isUnsaid && !unsaidOK && !op.need) || (hardenedOut(op.v) && !op.needK) ||
         (op.needK && !hasKeepsake(op.needK)) ||
         (op.need && (!op.need.secret || !op.need.secret.some(k=>S.found.indexOf(k)>=0)));
}

function renderNode(node, ctx){
  cur={node, ctx};
  if(PRES && lastVoteNode !== node){ VOTES = {}; lastVoteNode = node; }
  const npcId = (ctx&&ctx.npc) || (typeof node.npc==="string" ? node.npc : null);
  const inner = node.inner || (ctx&&ctx.inner);
  const o = node;
  const speaker = npcId ? npcName(npcId) : (LANG==="zh"?"旁白":"Narration");
  const conf = o.conf;
  // The English rendering under the currently selected reading (Literal / Polite / True).
  const enLine = (MODE==="polite"&&o.polite) ? o.polite : (MODE==="true"&&o.tru) ? o.tru : o.en;
  const layerName = t(MODE==="true" ? "trueTr" : MODE);
  const badge = (conf!==undefined)
      ? `<span class="conf ${conf<60?'low':''}">${conf<60?"〔?〕 ":""}conf ${conf}%</span>` : "";
  // EN mode: the big line IS the English; the sub-line names the reading.
  // ZH mode: the big line is the Chinese original; the sub-line is the translation.
  const lineMain = LANG==="zh" ? o.zh : "\u201c"+enLine+"\u201d";
  const subLine = LANG==="zh"
      ? `<div class="sub"><span>EN ›</span><span class="en">\u201c${enLine}\u201d</span>${badge}</div>`
      : `<div class="sub"><span>${layerName}</span>${badge}</div>`;

  let opts = (o.opts||[]).slice();
  let leakIdx = -1;
  if(S.unsaid>=5 && S.unsaid<10 && !node.special){
    leakIdx = opts.findIndex(x=>x.v==="agree" && !x.need);
  }
  const unsaidOK = S.unsaid>=6 || S.stress>=70;
  const revealedNow = applyReveals(node);

  let html = `<div class="scene flash">
    <div class="spk"><span class="who${npcId?"":" narr"}">${speaker}</span></div>
    <div class="line ${LANG==='zh'?'zh':''}">${lineMain}</div>
    ${subLine}
    ${noticesHTML()}
    ${o.special==="reckoning"?reckonHTML():""}
    ${revealedNow.map(r => r==="__permit"
        ? `<div class="narr" style="color:var(--amber2)">✦ ${LANG==="zh"?"解锁物件：":"Keepsake unlocked: "}${keepName("permit")}</div>`
        : `<div class="narr" style="color:var(--cold2)">▸ ${say(ESCAPES[r])}</div>`).join("")}
    <div class="divider"></div>`;

  if(node.special==="flood"){
    html += `<div class="qh">${t("sayIt")}</div>
      <div class="opts"><button class="opt special" data-i="0" data-v="unsaid">
        <span class="k">↵</span><span class="txt"><span class="v">${verbName("unsaid")}</span>
        <span class="l">${LANG==="zh"?"「那你当时为什么不让我去？」":"“Then why didn't you let me go?”"}</span>
        <span class="fx">${fxText("unsaid", node, npcId)}</span></span></button></div></div>`;
    MAIN.innerHTML = html; bindOpts([{v:"unsaid",flood:true}]);
    renderSide(); renderCourse(node); renderChrome(); MAIN.scrollTop = 0;
    return;
  }

  html += `<div class="qh">${o.q? say(o.q) : t("whatSay")}</div><div class="opts">`;
  opts.forEach((op,i)=>{
    const isLeak = (i===leakIdx);
    const isUnsaid = op.v==="unsaid";
    const locked = optLocked(op, isUnsaid, unsaidOK);
    const showV = isLeak ? verbName("agree") : verbName(op.v);
    html += `<button class="opt ${isUnsaid?'special':''}" data-i="${i}" data-v="${isLeak?'passive':op.v}" ${locked?"disabled":""}>
      <span class="k">${KEYS[i]}</span>
      <span class="txt"><span class="v">${showV}</span>
      <span class="l">${say(op)}</span>
      <span class="fx">${isLeak?fxTextSimple("agree"):fxText(op.v, node, npcId)}</span></span></button>`;
  });
  html += `</div>`;

  if(PRES) html += votePanelHTML(opts);

  if(inner){
    html += `<div class="inner"><div class="hd"><div class="t">${t("inner")}</div>
      <span class="plus">${t("plusOne")}</span></div>
      <div class="x">${say(inner)}</div>
      <div class="sp">${LANG==="zh"?"它不会被任何人听见。":"Nobody is going to hear this."}</div></div>`;
  }
  html += `</div>`;
  MAIN.innerHTML = html;
  const all = Array.from(MAIN.querySelectorAll(".opt"));
  if(all.length && all.every(b=>b.disabled)) all[0].disabled = false; // never dead-end
  bindOpts(opts, leakIdx);
  renderSide();
  renderCourse(node);
  renderChrome();
  MAIN.scrollTop = 0;
}

function renderCourse(node){
  // Topic cards carry c as an ARRAY ("which courses may this card appear in"),
  // so it can never index the course-name table directly — it stringifies to
  // "2,3,7" and the header renders blank. Fall back to the schedule slot.
  let c = node.c;
  if(Array.isArray(c)) c = (S.schedule[S.step] && S.schedule[S.step].c) || c[0];
  c = c || (S.schedule[S.step] && S.schedule[S.step].c) || 1;
  $("course").textContent = t("course")[c] || "";
  const h = Math.floor(S.clock/60), m = S.clock%60;
  $("clock").textContent = h + ":" + (m<10?"0":"") + m;
}

function reckonHTML(){
  const l = S.ledger[S.reckonNpc||"mom"];
  const who = npcName(S.reckonNpc||"mom");
  const total = 370000 + l.gave*120;
  const asked = Math.round(total*0.22);
  return `<div class="narr" style="color:var(--amber2);font-family:var(--serif);font-size:17px;line-height:1.6;margin-bottom:10px">
    ${LANG==="zh"
      ? `${who}：「你从小学到大学，学费、生活费、补习班，我一笔一笔记着呢。三十七万。」`
      : `${who}: “From primary school to university — tuition, living costs, cram school. I kept a record of every yuan. Three hundred and seventy thousand.”`}
    </div>
    <div class="narr" style="border-left:2px solid var(--line);padding-left:14px;font-size:14px;line-height:1.65;margin-bottom:6px">
      ${LANG==="zh"
        ? `${who}记得的：<b style="color:var(--amber2)">+${total.toLocaleString()}</b>（${who}为你做的）<br>
           ${who}替你决定的：<b style="color:var(--red)">−${asked.toLocaleString()}</b>（你从来没要过的）<br>
           <span style="color:var(--faint)">你的账本上记的是：−${l.owed}。你们记的不是同一本账。</span>`
        : `What ${who} recorded: <b style="color:var(--amber2)">+${total.toLocaleString()}</b> — done for you.<br>
           What ${who} decided for you: <b style="color:var(--red)">−${asked.toLocaleString()}</b> — never asked for.<br>
           <span style="color:var(--faint)">Your book says you owe ${l.owed}. You have never been keeping the same book.</span>`}
    </div>`;
}

function bindOpts(opts, leakIdx){
  MAIN.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.i;
      if(opts.length===1 && opts[0].flood){ doFlood(); return; }
      const op = opts[i];
      if(op && op.go){                       // branch within the same schedule slot
        S.clock += 10;
        S.escChoice = op.go;
        const tgt = SPINE[op.go];
        if(tgt) return renderNode(tgt, {});
      }
      choose(op, i===leakIdx, opts);
    };
  });
}

/* ---- choose ---- */
function choose(op, wasLeak, opts){
  const node = cur.node;
  let verb = wasLeak ? "passive" : op.v;
  const npcId = (cur.ctx&&cur.ctx.npc) || (typeof node.npc==="string" ? node.npc : null);
  const notices = [];
  let extraFavor = 0;
  S.noticeQueue = [];

  if(node.special==="reckoning"){
    S.reckoning = (verb==="agree"||verb==="dumb") ? "take" : "refuse";
  }
  if(op.lect) S.lectured = true;

  const res = applyVerb(verb, npcId);
  const delta = res.delta;

  // A node may be weighted down (the goodbye is 0.35) so a single screen can
  // never outweigh the whole evening. Sign is preserved, magnitude rounds to
  // at least 1 so a choice never becomes a no-op.
  const w = (typeof node.w === "number") ? node.w : 1;
  if(w !== 1){
    for(const k in delta){
      const raw = delta[k] * w;
      delta[k] = raw >= 0 ? Math.round(raw) : -Math.round(-raw);
      if(delta[k] === 0 && raw !== 0) delta[k] = raw > 0 ? 1 : -1;
    }
  }

  // ---- Translation confidence becomes real: on a line nobody is sure about,
  //      answering warmly is a guess, and half the time you guessed wrong. ----
  if(node.conf!==undefined && node.conf<60 && WARM_VERBS.indexOf(verb)>=0){
    if(rnd(100) < 50){
      for(const k in delta) if(delta[k]>0) delta[k] = Math.max(1, Math.round(delta[k]*0.5));
      extraFavor -= 6;
      notices.push({text:t("misread"), bad:true});
    }
  }

  // ---- explicit 2d6 check on the high-stakes nodes ----
  let checkRoll = null;
  if(node.check && RISKY_VERBS.indexOf(verb)>=0){
    const d1=rnd(6)+1, d2=rnd(6)+1; checkRoll = d1+d2;
    const mod = clamp(Math.floor((S.self-50)/20), -2, 2);
    if(checkRoll + mod < node.check.diff){
      for(const k in delta){
        if(k==="face"||k==="filial") delta[k] = -Math.abs(delta[k]) - 2;
        if(k==="self") delta[k] = Math.round(delta[k]*0.4);
      }
      delta.stress = (delta.stress||0) + 6;
      extraFavor -= 8;
      notices.push({text:(LANG==="zh"?"话没接住。":"It didn't land."), bad:true});
    }
  }

  applyDelta(delta);
  applyLedger(verb, npcId);
  if(npcId){
    const base = FAVOR_BASE[verb]||0;
    S.npc[npcId].favor = clamp(S.npc[npcId].favor + base + extraFavor, 0, 100);
    // ripples are surfaced to the player now — the web is not a hidden system
    applyRipples(npcId).forEach(txt => notices.push({text:txt}));
  }
  if(verb==="ally"){
    const others = Object.keys(NPCS).filter(x=>x!==npcId);
    const a = pick(others); S.npc[a].favor = clamp(S.npc[a].favor-8,0,100);
  }
  if(verb==="scapegoat"){
    const others = Object.keys(NPCS).filter(x=>x!==npcId);
    const a = pick(others); S.npc[a].favor = clamp(S.npc[a].favor-20,0,100);
  }
  if(verb==="confront" && npcId==="nai") S.npc.cous.favor=clamp(S.npc.cous.favor+10,0,100);

  // hidden fatigue
  if(verb==="silence"||verb==="dumb"||verb==="deflect") S.fatigue = clamp(S.fatigue+2,0,100);
  if(verb==="confront"||verb==="scapegoat") S.fatigue = clamp(S.fatigue+5,0,100);
  if(verb==="ritual"||verb==="ally") S.fatigue = clamp(S.fatigue-3,0,100);

  const hard = checkHardening(verb);

  // reveal
  if(verb==="silence" && S.flooded) S.silenceAfterFlood = true;

  // history — used for the recap on the ending card
  S.history.push(verb);
  if(op.coda) S.lastCoda = op.coda;
  // The leak is silent while you choose, and revealed right after: the point is
  // that you could not control what came out, not that the button warned you.
  if(wasLeak) notices.push({text:t("leakNote"), bad:true});
  S.noticeQueue = notices;

  S.clock += 8 + rnd(9);
  S.step++;
  advance();
}

function doFlood(){
  S.flooded = true;
  applyDelta({face:-8,filial:-10,self:15,stress:-20,unsaid:-S.unsaid});
  S.history.push("flood");
  // NOTE: no S.step++ here. The flood is rendered *in place of* nothing —
  // advance() shows it before consuming the pending slot. Incrementing here
  // silently ate the next scene (an entire course, or the Reckoning).
  advance();
}

function advance(){
  if(S.stress>=100 || S.face<=0 || S.self<=0){ return showEnding(); }
  // flood injection
  if(!S.flooded && S.unsaid>=10){
    return renderNode(SPINE.flood, {});
  }
  while(S.step < S.schedule.length){
    const st = S.schedule[S.step];
    // ---- Compounding Pressure ----
    // Every course boundary, the evening bills you for three things:
    //   what you did not say, who you stopped being, and how good you were.
    // Being the perfect child is exhausting, and that is the whole point.
    const cc = st.c || 1;
    if(cc !== S.lastCourse){
      let bill = Math.floor(S.unsaid/2);
      if(S.self<=30) bill += 3;
      if(S.filial>=85) bill += 2;
      S.stress = clamp(S.stress + bill, 0, 100);
      S.fatigue = clamp(S.fatigue + 1, 0, 100);
      S.lastCourse = cc;
      if(S.stress>=100) return showEnding();
    }
    if(st.t==="node"){
      if(st.id==="reckoning"){
        // pick the npc with the biggest gap
        let best="mom", bg=-1;
        for(const id in S.ledger){ const g=S.ledger[id].gave-S.ledger[id].owed; if(g>bg){bg=g;best=id;} }
        S.reckonNpc = best;
      }
      if(st.id==="oldscore"){
        const os = S.oldscores[S.osIdx % S.oldscores.length]; S.osIdx++;
        return renderNode(os, {});
      }
      return renderNode(SPINE[st.id], {});
    }
    if(st.t==="draw"){
      let cands = S.deck.filter(x=>x.c.indexOf(st.c)>=0);
      if(!cands.length){
        // The deck is only 10 of 32 cards, so an early course can run dry.
        // Refill from cards this run has not used yet instead of silently
        // deleting the slot (which made the decision count drift 15–17).
        const pool = TOPICS.filter(x=>x.c.indexOf(st.c)>=0 && S.drawn.indexOf(x.id)<0);
        if(pool.length){ const c2 = pool[rnd(pool.length)]; S.deck.push(c2); cands = [c2]; }
      }
      if(cands.length){
        // Weighted draw. Base weight by how loaded the topic is, and every
        // point of UNSAID makes a landmine more likely. The longer you hold it
        // in, the worse the conversation gets — the room can feel it.
        const w = cands.map(c => (c.mine===3 ? 3 : c.mine===2 ? 4 : 5) + (c.mine===3 ? S.unsaid*0.6 : 0));
        let total = w.reduce((a,b)=>a+b,0), r = Math.random()*total, idx = 0;
        for(let i=0;i<cands.length;i++){ r -= w[i]; if(r<=0){ idx=i; break; } }
        const card = cands[idx];
        S.deck = S.deck.filter(x=>x!==card);
        S.drawn.push(card.id);
        const npc = card.npc[rnd(card.npc.length)];
        return renderNode(card, {npc});
      }
      S.step++; continue;
    }
  }
  showEnding();
}

/* ---- ending ---- */
function showEnding(){
  const e = wheelEarned() ? ENDINGS.find(x=>x.id==="wheel") : resolveEnding();
  let unlocked = null;
  META.runs++;
  if(!META.endings.includes(e.id)) META.endings.push(e.id);
  // An ending may map to more than one keepsake. Grant the first one the player
  // does not already own — otherwise the second is unreachable forever.
  const keepId = Object.keys(KEEPSAKES).find(k=>KEEPSAKES[k].how===e.id && META.keepsakes.indexOf(k)<0);
  if(keepId){ META.keepsakes.push(keepId); unlocked = keepId; }
  saveMeta(META);
  LAST_ENDING = e; LAST_UNLOCKED = unlocked;
  renderEndingCard(e, unlocked);
}

function renderEndingCard(e, unlocked){
  RESHOW = "ending";
  const wheelOpen = wheelGateOpen(META.runs);

      ? npcName(S.reckonNpc) : null;

  // Archive and the balance tool keep matching on it; only a different reckoner
  // gets a substituted name.
  const endName = (reckName && S.reckonNpc !== "mom")
      ? (LANG==="zh"
          ? `${reckName}的账本 · ${(e.n.zh.split("·")[1]||"").trim()}`
          : `${reckName.toUpperCase()}'S LEDGER — ${(e.n.en.split("—")[1]||"").trim()}`)

  OV.innerHTML = `<div class="card flash">
    <div class="end-t">${LANG==="zh"?"结局":"Ending"}${e.rare?` · ${LANG==="zh"?"稀有":"RARE"}`:""}</div>
    <div class="end-n">${endName}</div>
    <div class="end-z">${LANG==="zh"?e.n.en:e.n.zh}</div>
    <div class="end-txt">${say(e.t)}</div>
    <div class="end-sub">“${say(e.q)}”</div>
    ${codaHTML()}
    ${e.id==="wheel"?wheelBlock():""}
    <div class="stats">
      <span>FACE <b>${S.face}</b></span><span>FILIAL <b>${S.filial}</b></span>
      <span>SELF <b>${S.self}</b></span><span>STRESS <b>${S.stress}</b></span>
      <span>UNSAID <b>${S.unsaid}</b></span>
      <span>${LANG==="zh"?"秘密":"Secrets"} <b>${S.found.length}</b></span>
      <span>${LANG==="zh"?"妈妈的账":"Mom's book"} <b>+${S.ledger.mom.gave} / −${S.ledger.mom.owed}</b></span>
      <span style="opacity:.55">${LANG==="zh"?"妈妈的疲惫":"Mom's fatigue"} <b>${S.fatigue}</b></span>
    </div>
    <div class="narr" style="text-align:center;font-size:13px;margin:0 auto 18px;max-width:520px">
      ${fatigueLine()}
    </div>
    ${recapHTML()}
    ${unlocked?`<div class="unlocked">${LANG==="zh"?"解锁物件":"Keepsake unlocked"}${LANG==="zh"?"：":": "}<b>${keepName(unlocked)}</b></div>`:""}
    <div class="unlocked" style="border:none">
      ${LANG==="zh"?`已度过 <b>${META.runs}</b> 年 · 物件 <b>${META.keepsakes.length}</b> 件 · 已见结局 <b>${META.endings.length}/14</b>`
                  :`<b>${META.runs}</b> year(s) survived · <b>${META.keepsakes.length}</b> keepsakes · <b>${META.endings.length}/14</b> endings seen`}
      <div style="margin-top:10px;color:${wheelOpen?'var(--amber2)':'var(--faint)'}">
        ${wheelOpen? t("wheelOpen") : t("needWheel")}
      </div>
    </div>
    <div class="menu" style="margin-top:26px">

function startRun(isPres){
  try{

      `<span class="w" style="animation-delay:${(0.12*i+1.1).toFixed(2)}s">${word}</span></div>`).join("") + `</div>`;

function showTut(step, from, dir){
  if(from !== undefined) TUT_FROM = from;
  TUT_STEP = clamp(step, 0, TUT.length-1);
  RESHOW = "tut";
  const st = TUT[TUT_STEP], last = TUT_STEP === TUT.length-1;
  const dc = (dir === undefined || dir >= 0) ? "fwd" : "back";
  OV.innerHTML = `<div class="card tut-card">
    <div class="tut-top"><span class="logo"><b>U N S A I D</b></span>
      <span class="tut-count">${TUT_STEP+1} / ${TUT.length}</span></div>
    <div class="tut-step ${dc}">
      <div class="tut-t">${say(st.t)}</div>
      <div class="tut-b">${say(st.b)}</div>
      ${st.demo ? tutDemoHTML(st.demo) : ""}
    </div>
    <div class="tut-dots">${TUT.map((_,i)=>`<i class="${i===TUT_STEP?'on':''}"></i>`).join("")}</div>
    <div class="tut-nav">
      <button class="mi" id="tut-skip">${t("tutSkip")}</button>
      <span style="flex:1"></span>
      <button class="mi" id="tut-prev" ${TUT_STEP===0?"disabled":""}>${t("tutPrev")}</button>
      <button class="mi primary" id="tut-next">${last ? t("tutDone") : t("tutNext")}</button>
    </div>
    <div class="hint" style="margin-top:14px">
      <kbd>←</kbd> <kbd>→</kbd> ${LANG==="zh"?"翻页":"navigate"} &nbsp;·&nbsp;
      <kbd>Esc</kbd> ${LANG==="zh"?"关闭":"close"} &nbsp;·&nbsp;
      <kbd>L</kbd> ${LANG==="zh"?"语言":"language"}
    </div>
  </div>`;
  OV.style.display = "flex";
  OV.scrollTop = 0;
  $("tut-skip").onclick = closeTut;
  $("tut-prev").onclick = ()=>tutNav(-1);
  $("tut-next").onclick = ()=>tutNav(1);
}
function tutNav(d){
  const n = TUT_STEP + d;
  if(n >= TUT.length){ closeTut(); return; }   // stepping past the end = done
  if(n < 0) return;
  showTut(n, undefined, d);
}
function closeTut(){
  markTutSeen();
  const back = TUT_FROM;
  if(!back){ RESHOW = null; OV.style.display = "none"; OV.innerHTML = ""; return; }
  RESHOW = back;           // redrawOverlay re-renders title / archive / ending
  redrawOverlay();
}

   INPUT

/* Redraw whichever screen is currently up. Switching language used to always
   fall through to title(), which threw the ending card away. */
function redrawOverlay(){
  if(OV.style.display !== "flex") return;
  if(RESHOW==="archive") archive();
  else if(RESHOW==="ending" && LAST_ENDING) renderEndingCard(LAST_ENDING, LAST_UNLOCKED);
  else if(RESHOW==="tut") showTut(TUT_STEP);
  else if(RESHOW==="error"){ /* leave the error page alone */ }
  else title();
}
/* The three chrome toggles, shared by the keyboard and the topbar buttons so
   the two paths can never drift apart. */
function toggleLang(){ LANG = LANG==="en"?"zh":"en"; redrawOverlay(); if(cur) renderNode(cur.node,cur.ctx); renderSide(); renderChrome(); }
function cycleMode(){ MODE = MODES[(MODES.indexOf(MODE)+1)%3]; if(cur) renderNode(cur.node, cur.ctx); renderChrome(); }
function toggleHints(){ HINTS=!HINTS; if(cur) renderNode(cur.node,cur.ctx); renderChrome(); }

document.addEventListener("keydown", ev=>{
  const k = ev.key;
  /* tutorial: it owns the keyboard while it is up (L still switches language) */
  if(RESHOW==="tut"){
    if(k==="l"||k==="L"){ toggleLang(); return; }
    if(k==="ArrowRight"||k==="Enter"||k===" "){ ev.preventDefault(); tutNav(1); return; }
    if(k==="ArrowLeft"){ ev.preventDefault(); tutNav(-1); return; }
    if(k==="Escape"){ ev.preventDefault(); closeTut(); return; }
    return;
  }
  /* classroom mode: digits count hands, space decides */
  if(PRES && "123456".indexOf(k)>=0){
    const i = +k - 1, btns = MAIN.querySelectorAll(".opt");
    if(btns[i] && !btns[i].disabled){ VOTES[i] = (VOTES[i]||0)+1; renderVotes(); }
    ev.preventDefault(); return;
  }
  if(PRES && (k===" "||k==="Enter")){
    const live = Array.prototype.slice.call(MAIN.querySelectorAll(".opt:not([disabled])"));
    if(live.length){ ev.preventDefault(); voteWinner(live).click(); }
    return;
  }
  if(k==="Tab"){ ev.preventDefault(); cycleMode(); return; }
  if(k==="l"||k==="L"){ toggleLang(); return; }
  if(k==="h"||k==="H"){ toggleHints(); return; }
  if(k==="?"){ ev.preventDefault(); showTut(0, RESHOW); return; }
  if(OV.style.display === "flex") return;   // never act on the game behind a card
  const idx = "abcdef".indexOf(k.toLowerCase());
  if(idx>=0){
    const btns = MAIN.querySelectorAll(".opt");
    if(btns[idx] && !btns[idx].disabled){ btns[idx].click(); }
  }
  if(k==="Enter"||k===" "){
    // Always swallow Space: several screens scroll, and Space should never
    // silently scroll the Reckoning away.
    ev.preventDefault();
    if(OV.style.display === "flex") return;
    const btns = MAIN.querySelectorAll(".opt:not([disabled])");
    if(btns.length===1) btns[0].click();
  }
});
$("k-lang").onclick = toggleLang;
$("k-mode").onclick = cycleMode;
$("k-hint").onclick = toggleHints;
$("k-help").onclick = ()=>showTut(0, RESHOW);

}
